[tools]
go = "1.26"
golangci-lint = "2.13.2"

[tasks.build]
run = '''
sha="$(git rev-parse --short=12 HEAD)"
tag="$(git describe --tags --exact-match --match 'v[0-9]*' 2>/dev/null || true)"
ldflags="-X main.gitSHA=$sha"
if [ -n "$tag" ]; then
  ldflags="$ldflags -X main.releaseVersion=$tag"
fi
go build -ldflags "$ldflags" -o kantan ./...
'''

[tasks.test]
run = "go test ./..."

[tasks.lint]
run = "golangci-lint run ./..."

[tasks.fmt-check]
run = '''
files="$(gofmt -l .)"
if [ -n "$files" ]; then
  echo "$files"
  exit 1
fi
'''

[tasks.vet]
run = "go vet ./..."

[tasks.check]
run = [
  "mise run fmt-check",
  "mise run vet",
  "mise run build",
  "mise run test",
  "mise run lint",
]

[tasks.clean]
run = "go clean"
